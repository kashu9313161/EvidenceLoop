[server]
# Matches MAX_ARCHIVE_DOWNLOAD_BYTES in core/config.py (100 MB).
maxUploadSize = 100

[client]
# "viewer" keeps the ⋮ menu, which holds Settings → Light / Dark / System.
toolbarMode = "viewer"

# Light and dark themes (adapted from Streamlit's bundled shadcn-dual template).
# Defining both [theme.light] and [theme.dark] enables the appearance toggle;
# the default follows the operating system. No web fonts: the app stays local.

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 14
headingFontWeights = [600, 600, 600, 600, 600, 600]

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#1D4ED8"
borderColor = "#E2E8F0"
codeTextColor = "#0F172A"
grayColor = "#64748B"
blueColor = "#2563EB"
greenColor = "#16A34A"
redColor = "#DC2626"
yellowColor = "#CA8A04"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
chartCategoricalColors = [
  "#2563EB", "#EA580C", "#16A34A", "#7C3AED", "#DB2777",
  "#0891B2", "#CA8A04", "#DC2626", "#4F46E5", "#64748B",
]
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#111827"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
linkColor = "#93C5FD"
borderColor = "#1F2937"
codeTextColor = "#E2E8F0"
grayColor = "#94A3B8"
blueColor = "#60A5FA"
greenColor = "#4ADE80"
redColor = "#F87171"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
violetColor = "#A78BFA"
chartCategoricalColors = [
  "#60A5FA", "#FB923C", "#4ADE80", "#A78BFA", "#F472B6",
  "#22D3EE", "#FACC15", "#F87171", "#818CF8", "#94A3B8",
]
dataframeBorderColor = "#1F2937"
dataframeHeaderBackgroundColor = "#111827"
dataframeHeaderTextColor = "#F1F5F9"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
borderColor = "#E2E8F0"

[theme.dark.sidebar]
backgroundColor = "#070B14"
secondaryBackgroundColor = "#111827"
textColor = "#F1F5F9"
borderColor = "#1F2937"
