[project]
name = "evidenceloop"
version = "2.0.0"
description = "Understand a codebase before you change it: a map, a plain-English overview and evidence-backed issues."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "networkx>=3.2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# AI features (file explanations, Ask's open questions, Jev). Gemini needs nothing extra.
ai = ["anthropic>=2.0", "typesafe-sdk>=0.7.5"]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6", "evidenceloop[ai]"]

[project.scripts]
evidenceloop = "cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analysis*", "api*", "cli*", "core*", "ingestion*", "intelligence*", "retrieval*",
           "storage*", "verification*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Extracted repositories under data/ contain their own test suites.
norecursedirs = ["data", ".venv", ".git"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
