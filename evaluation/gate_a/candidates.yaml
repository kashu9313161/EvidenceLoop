      text: |2-
            def striptags(self, /) -> str:
                """:meth:`unescape` the markup, remove tags, and normalize
                whitespace to single spaces.

                >>> Markup("Main &raquo;\t<em>About</em>").striptags()
                'Main » About'
                """
                value = str(self)
                parts = []
                pos = 0

                while (start := value.find("<", pos)) != -1:
                    if value.startswith("<!--", start):
                        # comment
                        if (end := value.find("-->", start + 4)) == -1:
                            # unclosed
                            break

                        end += 3
                    else:
                        # tag
                        if (end := value.find(">", start)) == -1:
                            # unclosed
                            break

                        end += 1

                    parts.append(value[pos:start])
                    pos = end

                # found at least one tag, combine parts
                if pos > 0:
                    # any trailing data after the last closed tag
                    parts.append(value[pos:])
                    value = "".join(parts)

                # collapse spaces
                value = " ".join(value.split())
                # unescape the processed value using the current class
                return self.__class__(value).unescape()
    suggested_label: ambiguous
    reason: "Well-formed tags and comments are removed, but the loop stops at an unclosed tag and keeps the rest."
    human_label:
